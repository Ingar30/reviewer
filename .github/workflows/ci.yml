name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest

      - name: Check skills-only plugin bundle drift
        run: python scripts/build_work_plugin.py --check

      - name: Check shareable tracked files
        run: python scripts/check_shareable_repo.py

      - name: Check sensitive-name hygiene
        run: python scripts/check_tracked_sensitive_names.py

      - name: Prepare canonical submission candidate
        run: python scripts/prepare_plugin_submission.py --output output/plugin-candidate

      - name: Retain tested candidate (not a public release)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-plugin-candidate-${{ github.sha }}
          path: output/plugin-candidate/
          if-no-files-found: error
          retention-days: 30
